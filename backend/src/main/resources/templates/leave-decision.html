<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8">
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;}
  .container{max-width:600px;margin:30px auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;}
  .header-approved{background:#16a34a;color:white;padding:30px;text-align:center;}
  .header-rejected{background:#dc2626;color:white;padding:30px;text-align:center;}
  .header-approved h1,.header-rejected h1{margin:0;font-size:24px;}
  .body{padding:30px;color:#333;}
  table{width:100%;border-collapse:collapse;margin:16px 0;}
  td{padding:10px;border:1px solid #e5e7eb;}
  td:first-child{background:#f9fafb;font-weight:bold;width:40%;}
  .comment-box{background:#f0f9ff;border-left:4px solid #0ea5e9;padding:12px;margin:16px 0;}
  .footer{padding:20px 30px;background:#f9f9f9;color:#888;font-size:12px;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <div th:class="${approved} ? 'header-approved' : 'header-rejected'">
    <h1 th:text="${approved} ? '✅ Leave Approved' : '❌ Leave Rejected'"></h1>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${employeeName}">Employee</strong>,</p>
    <p th:text="${approved} ? 'Your leave request has been approved.' : 'Your leave request has been rejected.'"></p>
    <table>
      <tr><td>Leave Type</td><td th:text="${leaveType}"></td></tr>
      <tr><td>From</td><td th:text="${startDate}"></td></tr>
      <tr><td>To</td><td th:text="${endDate}"></td></tr>
      <tr><td>Status</td><td th:text="${decision}"></td></tr>
    </table>
    <div class="comment-box" th:if="${comment != null and !#strings.isEmpty(comment)}">
      <strong>Manager's Comment:</strong><br>
      <span th:text="${comment}"></span>
    </div>
  </div>
  <div class="footer">© 2024 HRMS</div>
</div>
</body>
</html>
